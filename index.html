    <script>
      // 0. Auto-redirect to compiled standalone single-file if opened directly via file:// in dev root
      if (window.location.protocol === 'file:' && window.location.pathname.endsWith('index.html') && !window.location.pathname.includes('/dist/')) {
        window.location.replace('./smart-logistics-single-file.html');
      }

      // 1. ป้องกันปัญหาเปิดบน GitHub Pages โดยไม่มีเครื่องหมาย slash ท้าย URL
      if (!location.pathname.endsWith('/') && !location.pathname.split('/').pop().includes('.')) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }

      // 2. ป้องกันเครื่องพนักงานและเบราว์เซอร์ค้างแคชเวอร์ชันเก่า
      var CURRENT_APP_VERSION = 'v2.0.0';
      var previousVersion = localStorage.getItem('smart_logistic_app_version');
      if (previousVersion && previousVersion !== CURRENT_APP_VERSION) {
        localStorage.setItem('smart_logistic_app_version', CURRENT_APP_VERSION);
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
      } else {
        localStorage.setItem('smart_logistic_app_version', CURRENT_APP_VERSION);
      }

      // Background Version Watchdog: ตรวจจับเวอร์ชันจากเซิร์ฟเวอร์แบบ Real-time ทันที (เฉพาะเมื่อเปิดผ่าน Web Server)
      (function() {
        if (window.fetch && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
          fetch('./VERSION.txt?t=' + Date.now(), { cache: 'no-store' })
            .then(function(res) { return res.ok ? res.text() : ''; })
            .then(function(txt) {
              var m = txt.match(/Version:\s*(v[0-9]+\.[0-9]+\.[0-9]+)/i);
              if (m && m[1] && m[1].toLowerCase() !== CURRENT_APP_VERSION.toLowerCase()) {
                console.warn('[VersionWatchdog] New version detected:', m[1], 'Current:', CURRENT_APP_VERSION);
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    names.forEach(function(n) { caches.delete(n); });
                  });
                }
                var cleanVer = m[1].replace('v', '');
                var currentSearch = new URLSearchParams(window.location.search);
                if (currentSearch.get('v') !== cleanVer) {
                  currentSearch.set('v', cleanVer);
                  currentSearch.set('_t', Date.now());
                  window.location.replace(window.location.pathname + '?' + currentSearch.toString() + window.location.hash);
                }
              }
            })
            .catch(function() {});
        }
      })();

      // 3. ฟังก์ชันแสดงข้อผิดพลาดบนหน้าจอแบบสมบูรณ์ ป้องกันปัญหาจอขาวหรือค้าง
      function showAppError(msg) {
        var root = document.getElementById('root');
        if (root && root.querySelector('#app-loading-screen')) {
          root.innerHTML = '<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; padding: 20px; font-family: sans-serif; text-align: center;"><div style="max-width: 440px; width: 100%; background: #ffffff; border-radius: 24px; padding: 28px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);"><div style="font-size: 40px; margin-bottom: 8px;">⚠️</div><h3 style="margin: 0 0 8px 0; font-size: 17px; font-weight: bold; color: #0f172a;">พบข้อผิดพลาดในการรันระบบ</h3><p style="font-size: 12px; margin: 8px 0 16px 0; color: #be123c; line-height: 1.5; font-family: monospace; background: #fff1f2; padding: 10px 14px; border-radius: 12px; word-break: break-word;">' + (msg || 'Script loading or initialization error') + '</p><div style="display: flex; gap: 8px; justify-content: center;"><button onclick="location.reload(true)" style="padding: 10px 18px; background: #2563eb; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 13px;">รีเฟรชหน้าเว็บ</button><button onclick="localStorage.clear(); location.reload(true);" style="padding: 10px 18px; background: #e2e8f0; color: #334155; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 13px;">ล้างแคชระบบ</button></div></div></div>';
        }
      }

      window.addEventListener('error', function(e) {
        // Ignore external element resource errors (e.g. CDN scripts, images, fonts)
        if (e.target && e.target.nodeType === 1) {
          console.warn('Resource load warning (non-fatal):', e.target.src || e.target.href);
          return;
        }
        var msg = e.message || 'Script initialization error';
        showAppError(msg);
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        console.warn('Unhandled rejection:', e.reason);
      });
    </script>

            <button onclick="localStorage.clear(); location.reload(true);" style="padding: 8px 14px; background: rgba(255,255,255,0.2); color: #ffffff; border: none; border-radius: 10px; font-weight: bold; font-size: 12px; cursor: pointer;">ล้างแคชระบบ</button>

        </div>

    <script>

        var reliefBox = document.getElementById('cache-relief-box');
        if (reliefBox) {
          reliefBox.style.display = 'block';
        }
      }, 3500);

function getOrCreateSheet(ss, name, headers, tabColor, headerBg, headerColor) {
  if (!ss) return null;
  var sheet = ss.getSheetByName(name);
  if (!sheet) {
    sheet = ss.insertSheet(name);
  }
  if (sheet.getLastRow() === 0 && headers && headers.length > 0) {
    sheet.appendRow(headers);
    if (tabColor) {
      try { sheet.setTabColor(tabColor); } catch (e) {}
    }
    if (headerBg) {
      try {
        sheet.getRange(1, 1, 1, headers.length)
          .setFontWeight('bold')
          .setBackground(headerBg)
          .setFontColor(headerColor || '#000000');
        sheet.setFrozenRows(1);
      } catch (e) {}
    }
  }
  return sheet;
}

// อัปโหลดรูปภาพขึ้น Google Drive และส่งคืน URL เปิดดูภาพ
function uploadBase64ToDrive(base64Data, folderName, fileName) {
  try {
    if (!base64Data || typeof base64Data !== 'string') return '';
    var match = base64Data.match(/^data:image/([a-zA-Z0-9]+);base64,(.+)$/);
    var raw = match ? match[2] : base64Data;
    var ext = match ? match[1] : 'jpg';
    if (ext === 'jpeg') ext = 'jpg';
    var decoded = Utilities.base64Decode(raw);
    var blob = Utilities.newBlob(decoded, 'image/' + ext, fileName || ('photo_' + Date.now() + '.' + ext));

    var rootFolders = DriveApp.getFoldersByName('Smart_Logistics_Cloud_Drive');
    var rootFolder = rootFolders.hasNext() ? rootFolders.next() : DriveApp.createFolder('Smart_Logistics_Cloud_Drive');

    var subFolders = rootFolder.getFoldersByName(folderName || 'General');
    var targetFolder = subFolders.hasNext() ? subFolders.next() : rootFolder.createFolder(folderName || 'General');

    var file = targetFolder.createFile(blob);
    try {
      file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
    } catch (e) {}
    return file.getUrl();
  } catch (err) {
    return '';
  }
}

        var data = sheetJobs.getDataRange().getValues();
        for (var r = 1; r < data.length; r++) {
          var row = data[r];
          if (!row[0]) continue;
          var rawJson = row[24];
          if (rawJson && typeof rawJson === 'string' && rawJson.charAt(0) === '{') {
            try {
              result.jobs.push(JSON.parse(rawJson));
              continue;
            } catch (err) {}
          }
          result.jobs.push({
            id: 'job-' + String(row[0]),
            jobNumber: String(row[0]),
            companyId: String(row[1] || 'LOG'),
            jobType: String(row[2] || ''),
            title: String(row[3] || ''),
            customerName: String(row[4] || ''),
            customerPhone: String(row[5] || ''),
            customerAddress: String(row[6] || ''),
            customerLocationUrl: String(row[7] || ''),
            assignedStaffNames: row[8] ? String(row[8]).split(',').map(function(s){return s.trim();}) : [],
            assignedStaffIds: [],
            vehiclePlate: String(row[9] || ''),
            date: String(row[10] || ''),
            time: String(row[11] || ''),
            status: String(row[12] || 'ASSIGNED'),
            priority: String(row[13] || 'NORMAL'),
            startOdometer: row[14] ? Number(row[14]) : undefined,
            endOdometer: row[15] ? Number(row[15]) : undefined,
            totalDistanceKm: row[16] ? Number(row[16]) : undefined,
            totalExpenses: row[17] ? Number(row[17]) : 0,
            startOdometerDriveUrl: String(row[18] || ''),
            endOdometerDriveUrl: String(row[19] || ''),
            customerSignerName: String(row[21] || ''),
            notes: String(row[22] || ''),
            checklist: [],
            workPhotos: [],
            expenses: []
          });
        }
      }

      var vSheet = ss.getSheetByName('Vehicles_Master') || ss.getSheetByName('ข้อมูลรถ');
      if (vSheet) {
        var vData = vSheet.getDataRange().getValues();
        for (var vr = 1; vr < vData.length; vr++) {
          var vRow = vData[vr];
          if (!vRow[0]) continue;
          var vRawJson = vRow[19];
          if (vRawJson && typeof vRawJson === 'string' && vRawJson.charAt(0) === '{') {
            try {
              result.vehicles.push(JSON.parse(vRawJson));
              continue;
            } catch (err) {}
          }
        }
      }

      var uSheet = ss.getSheetByName('Users_Master') || ss.getSheetByName('ข้อมูลพนักงาน');
      if (uSheet) {
        var uData = uSheet.getDataRange().getValues();
        for (var ur = 1; ur < uData.length; ur++) {
          var uRow = uData[ur];
          if (!uRow[0]) continue;
          var uRawJson = uRow[10];
          if (uRawJson && typeof uRawJson === 'string' && uRawJson.charAt(0) === '{') {
            try {
              result.users.push(JSON.parse(uRawJson));
              continue;
            } catch (err) {}
          }
        }
      }

      var expSheet = ss.getSheetByName('Expenses_Log');
      if (expSheet) {
        var expData = expSheet.getDataRange().getValues();
        for (var er = 1; er < expData.length; er++) {
          var eRow = expData[er];
          if (!eRow[0]) continue;
          var eRawJson = eRow[13];
          if (eRawJson && typeof eRawJson === 'string' && eRawJson.charAt(0) === '{') {
            try {
              result.expenses.push(JSON.parse(eRawJson));
              continue;
            } catch (err) {}
          }
          result.expenses.push({
            id: 'exp-' + String(eRow[0]),
            expenseNumber: String(eRow[0]),
            jobNumber: String(eRow[1] || ''),
            companyId: String(eRow[2] || 'LOG'),
            category: String(eRow[3] || 'OTHER'),
            amount: Number(eRow[4]) || 0,
            description: String(eRow[5] || ''),
            paidByStaffName: String(eRow[6] || ''),
            fuelLitres: eRow[7] ? Number(eRow[7]) : undefined,
            fuelOdometer: eRow[8] ? Number(eRow[8]) : undefined,
            receiptDriveUrl: String(eRow[9] || ''),
            status: String(eRow[10] || 'PENDING'),
            date: String(eRow[11] || new Date().toISOString().split('T')[0]),
            createdAt: String(eRow[12] || new Date().toISOString())
          });
        }
      }

      var jtSheet = ss.getSheetByName('Job_Types_Master') || ss.getSheetByName('ประเภทงานและเช็คลิสต์');
      if (jtSheet) {
        var jtData = jtSheet.getDataRange().getValues();
        for (var jtr = 1; jtr < jtData.length; jtr++) {
          var jtRow = jtData[jtr];
          if (!jtRow[0]) continue;
          var jtRawJson = jtRow[6];
          if (jtRawJson && typeof jtRawJson === 'string' && jtRawJson.charAt(0) === '{') {
            try {
              result.jobTypes.push(JSON.parse(jtRawJson));
              continue;
            } catch (err) {}
          }
          var clList = [];
          try {
            if (jtRow[4] && typeof jtRow[4] === 'string') {
              clList = JSON.parse(jtRow[4]);
            }
          } catch (e) {}
          result.jobTypes.push({
            id: String(jtRow[0]),
            companyId: String(jtRow[1] || 'SRV'),
            name: String(jtRow[2] || ''),
            defaultChecklist: Array.isArray(clList) ? clList : []
          });
        }
      }
    } catch (err) {}

    return ContentService.createTextOutput(JSON.stringify({ status: 'success', data: result }))
      .setMimeType(ContentService.MimeType.JSON);
  }

  return ContentService.createTextOutput(JSON.stringify({
    status: 'connected',
    message: 'Google Apps Script (Universal Enterprise Cloud Engine) พร้อมทำงานเรียบร้อยแล้ว',
    spreadsheetName: ss.getName(),
    timestamp: new Date().toLocaleString('th-TH')
  })).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  try {
    lock.waitLock(10000);

    if (!e || !e.postData || !e.postData.contents) {
      return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: 'No payload' }))
        .setMimeType(ContentService.MimeType.JSON);
    }

    var payload = JSON.parse(e.postData.contents);
    var eventType = payload.eventType;
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    if (!ss && payload.sheetId) {
      try { ss = SpreadsheetApp.openById(payload.sheetId); } catch (err) {}
    }

    if (!ss) {
      return ContentService.createTextOutput(JSON.stringify({
        status: 'error',
        message: 'ไม่พบชีต: กรุณาเปิด Apps Script จากเมนู ส่วนขยาย > Apps Script ใน Google Sheets ที่ผูกกับระบบ'
      })).setMimeType(ContentService.MimeType.JSON);
    }

    setupSheets(ss);

    if (eventType === 'TEST') {
      return ContentService.createTextOutput(JSON.stringify({
        status: 'success',
        message: 'เชื่อมต่อ Google Apps Script สำเร็จ 100% (' + ss.getName() + ')'
      })).setMimeType(ContentService.MimeType.JSON);
    }

    // 1. บันทึก / อัปเดตใบงาน (UPSERT_JOB)
    if (eventType === 'UPSERT_JOB') {
      var job = payload.data;
      var jobHeaders = [
        'เลขที่ใบงาน', 'บริษัท', 'ประเภทงาน', 'ชื่องาน', 'ลูกค้า', 'เบอร์ติดต่อ',
        'สถานที่/ที่อยู่', 'พิกัด Maps', 'ผู้รับผิดชอบ', 'ทะเบียนรถ', 'วันที่', 'เวลานัด',
        'สถานะงาน', 'ความสำคัญ', 'ไมล์เริ่มต้น', 'ไมล์สิ้นสุด', 'ระยะทางรวม (กม.)',
        'ค่าใช้จ่ายรวม (บาท)', 'รูปรถ/ไมล์เริ่ม', 'รูปรถ/ไมล์จบ', 'รูปหน้างาน (ลิงก์)',
        'ลายเซ็นลูกค้า', 'หมายเหตุ', 'วันเวลาที่บันทึก', 'Raw_JSON'
      ];
      var sheet = ss.getSheetByName('Jobs_Master') || getOrCreateSheet(ss, 'Jobs_Master', jobHeaders, '#2563eb', '#dbeafe', '#1e40af');

      var folderName = 'Logistics_' + (job.jobNumber || 'General');
      var startOdoUrl = job.startOdometerPhoto && job.startOdometerPhoto.indexOf('data:image') !== -1
        ? uploadBase64ToDrive(job.startOdometerPhoto, folderName, 'start_odo.jpg')
        : (job.startOdometerDriveUrl || '');

      var endOdoUrl = job.endOdometerPhoto && job.endOdometerPhoto.indexOf('data:image') !== -1
        ? uploadBase64ToDrive(job.endOdometerPhoto, folderName, 'end_odo.jpg')
        : (job.endOdometerDriveUrl || '');

      var workPhotosUrls = [];
      if (Array.isArray(job.workPhotos)) {
        for (var pi = 0; pi < job.workPhotos.length; pi++) {
          var p = job.workPhotos[pi];
          if (p.dataUrl && p.dataUrl.indexOf('data:image') !== -1) {
            var url = uploadBase64ToDrive(p.dataUrl, folderName, 'work_' + (pi + 1) + '.jpg');
            p.driveUrl = url;
            workPhotosUrls.push(url);
          } else if (p.driveUrl) {
            workPhotosUrls.push(p.driveUrl);
          }
        }
      }

      var refDocUrl = job.referenceDocPhotoUrl && job.referenceDocPhotoUrl.indexOf('data:image') !== -1
        ? uploadBase64ToDrive(job.referenceDocPhotoUrl, folderName, 'ref_doc.jpg')
        : (job.referenceDocDriveUrl || '');

      var cleanJob = JSON.parse(JSON.stringify(job));
      cleanJob.startOdometerPhoto = undefined;
      cleanJob.startOdometerDriveUrl = startOdoUrl;
      cleanJob.endOdometerPhoto = undefined;
      cleanJob.endOdometerDriveUrl = endOdoUrl;
      cleanJob.referenceDocPhotoUrl = undefined;
      cleanJob.referenceDocDriveUrl = refDocUrl;
      if (cleanJob.customerSignatureUrl && cleanJob.customerSignatureUrl.indexOf('data:image') !== -1) {
        cleanJob.customerSignatureUrl = uploadBase64ToDrive(cleanJob.customerSignatureUrl, folderName, 'signature.png');
      }
      if (Array.isArray(cleanJob.workPhotos)) {
        for (var wi = 0; wi < cleanJob.workPhotos.length; wi++) {
          cleanJob.workPhotos[wi].dataUrl = undefined;
        }
      }

      var rowData = [
        job.jobNumber || '-',
        job.companyId || 'LOG',
        job.jobType || '-',
        job.title || '-',
        job.customerName || '-',
        job.customerPhone || '-',
        job.customerAddress || '-',
        job.customerLocationUrl || '-',
        (job.assignedStaffNames || []).join(', '),
        job.vehiclePlate || '-',
        job.date || '-',
        job.time || '-',
        job.status || 'ASSIGNED',
        job.priority || 'NORMAL',
        job.startOdometer || '',
        job.endOdometer || '',
        job.totalDistanceKm || '',
        job.totalExpenses || 0,
        startOdoUrl,
        endOdoUrl,
        workPhotosUrls.join(' | '),
        job.customerSignerName || '-',
        job.notes || '-',
        new Date().toLocaleString('th-TH'),
        JSON.stringify(cleanJob)
      ];

      var existingRow = -1;
      var lastRow = sheet.getLastRow();
      if (lastRow > 1) {
        var ids = sheet.getRange(2, 1, lastRow - 1, 1).getValues();
        for (var i = 0; i < ids.length; i++) {
          if (String(ids[i][0]).trim() === String(job.jobNumber).trim()) {
            existingRow = i + 2;
            break;
          }
        }
      }

      if (existingRow > 0) {
        sheet.getRange(existingRow, 1, 1, rowData.length).setValues([rowData]);
      } else {
        sheet.appendRow(rowData);
      }

      return ContentService.createTextOutput(JSON.stringify({
        status: 'success',
        action: existingRow > 0 ? 'UPDATED' : 'INSERTED',
        jobNumber: job.jobNumber,
        driveUrls: { startOdo: startOdoUrl, endOdo: endOdoUrl, refDoc: refDocUrl }
      })).setMimeType(ContentService.MimeType.JSON);
    }

    // 2. ลบใบงาน (DELETE_JOB)
    if (eventType === 'DELETE_JOB') {
      var delJob = payload.data;
      var dSheet = ss.getSheetByName('Jobs_Master') || ss.getSheetByName('Jobs');
      var wasDeleted = false;
      if (dSheet && delJob) {
        var dLast = dSheet.getLastRow();
        if (dLast > 1) {
          var dIds = dSheet.getRange(2, 1, dLast - 1, 1).getValues();
          for (var di = 0; di < dIds.length; di++) {
            if (String(dIds[di][0]).trim() === String(delJob.jobNumber).trim()) {
              dSheet.deleteRow(di + 2);
              wasDeleted = true;
              break;
            }
          }
        }
      }
      return ContentService.createTextOutput(JSON.stringify({
        status: 'success',
        action: 'DELETED',
        deleted: wasDeleted
      })).setMimeType(ContentService.MimeType.JSON);
    }

    // 3. บันทึกค่าใช้จ่าย (UPSERT_EXPENSE)
    if (eventType === 'UPSERT_EXPENSE') {
      var exp = payload.data;
      var expHeaders = [
        'เลขที่เบิก', 'เลขที่ใบงาน', 'บริษัท', 'หมวดหมู่', 'ยอดเงิน (บาท)',
        'รายละเอียด', 'ผู้ขอเบิก', 'ลิตรน้ำมัน', 'ไมล์ตอนเติม', 'รูปลิงก์สลิป/ใบเสร็จ',
        'สถานะอนุมัติ', 'วันที่เกิดค่าใช้จ่าย', 'Timestamp', 'Raw_JSON'
      ];
      var expSheet = getOrCreateSheet(ss, 'Expenses_Log', expHeaders, '#f59e0b', '#fef3c7', '#78350f');

      var receiptUrl = exp.receiptPhoto && exp.receiptPhoto.indexOf('data:image') !== -1
        ? uploadBase64ToDrive(exp.receiptPhoto, 'System_Receipts', 'receipt_' + (exp.expenseNumber || Date.now()) + '.jpg')
        : (exp.receiptDriveUrl || '');

      var cleanExp = JSON.parse(JSON.stringify(exp));
      cleanExp.receiptPhoto = undefined;
      cleanExp.receiptDriveUrl = receiptUrl;

      var expRow = [
        exp.expenseNumber || '-',
        exp.jobNumber || '-',
        exp.companyId || 'LOG',
        exp.category || 'OTHER',
        exp.amount || 0,
        exp.description || '-',
        exp.paidByStaffName || '-',
        exp.fuelLitres || '',
        exp.fuelOdometer || '',
        receiptUrl,
        exp.status || 'PENDING',
        exp.date || new Date().toISOString().split('T')[0],
        new Date().toLocaleString('th-TH'),
        JSON.stringify(cleanExp)
      ];

      var foundExpRow = -1;
      var expLast = expSheet.getLastRow();
      if (expLast > 1) {
        var expNums = expSheet.getRange(2, 1, expLast - 1, 1).getValues();
        for (var ei = 0; ei < expNums.length; ei++) {
          if (String(expNums[ei][0]).trim() === String(exp.expenseNumber).trim()) {
            foundExpRow = ei + 2;
            break;
          }
        }
      }

      if (foundExpRow > 0) {
        expSheet.getRange(foundExpRow, 1, 1, expRow.length).setValues([expRow]);
      } else {
        expSheet.appendRow(expRow);
      }

      return ContentService.createTextOutput(JSON.stringify({
        status: 'success',
        action: foundExpRow > 0 ? 'UPDATED' : 'INSERTED',
        expenseNumber: exp.expenseNumber,
        receiptUrl: receiptUrl
      })).setMimeType(ContentService.MimeType.JSON);
    }

    // 4. บันทึกข้อมูลรถยนต์ (UPSERT_VEHICLE)
    if (eventType === 'UPSERT_VEHICLE') {
      var veh = payload.data;
      var vehHeaders = [
        'Vehicle ID', 'ทะเบียนรถ', 'บริษัท', 'ยี่ห้อ/รุ่น', 'ประเภทเชื้อเพลิง',
        'สถานะ', 'พนักงานขับรถประจำ', 'ไมล์ปัจจุบัน', 'รอบระยะทาง (กม.)',
        'เตือนก่อน (กม.)', 'ไมล์ที่ซ่อมล่าสุด', 'ไมล์ซ่อมครั้งถัดไป',
        'รอบระยะเวลา (เดือน)', 'เตือนก่อน (วัน)', 'วันที่ซ่อมล่าสุด', 'วันที่ซ่อมครั้งถัดไป',
        'วันหมดอายุภาษี', 'วันหมดอายุ พ.ร.บ./ประกัน', 'Timestamp', 'Raw_JSON'
      ];
      var vSheet = getOrCreateSheet(ss, 'Vehicles_Master', vehHeaders, '#8b5cf6', '#ede9fe', '#5b21b6');

      var vRow = [
        veh.id || '-',
        veh.plateNumber || '-',
        veh.companyId || 'LOG',
        veh.brandModel || '-',
        veh.fuelType || 'DIESEL',
        veh.status || 'AVAILABLE',
        veh.assignedDriverName || '-',
        veh.currentOdometer || 0,
        veh.serviceIntervalKm || 10000,
        veh.warningLeadKm || 1000,
        veh.lastMaintenanceOdo || 0,
        veh.nextMaintenanceOdo || 0,
        veh.serviceIntervalMonths || 6,
        veh.warningLeadDays || 15,
        veh.lastMaintenanceDate || '-',
        veh.nextMaintenanceDate || '-',
        veh.taxExpiryDate || '-',
        veh.insuranceExpiryDate || '-',
        new Date().toLocaleString('th-TH'),
        JSON.stringify(veh)
      ];

      var vFoundRow = -1;
      var vLast = vSheet.getLastRow();
      if (vLast > 1) {
        var vIds = vSheet.getRange(2, 1, vLast - 1, 2).getValues();
        for (var vi = 0; vi < vIds.length; vi++) {
          if (String(vIds[vi][0]).trim() === String(veh.id).trim() || String(vIds[vi][1]).trim() === String(veh.plateNumber).trim()) {
            vFoundRow = vi + 2;
            break;
          }
        }
      }

      if (vFoundRow > 0) {
        vSheet.getRange(vFoundRow, 1, 1, vRow.length).setValues([vRow]);
      } else {
        vSheet.appendRow(vRow);
      }

      return ContentService.createTextOutput(JSON.stringify({
        status: 'success',
        action: vFoundRow > 0 ? 'UPDATED' : 'INSERTED',
        vehicleId: veh.id,
        plateNumber: veh.plateNumber
      })).setMimeType(ContentService.MimeType.JSON);
    }

    // 5. บันทึกข้อมูลพนักงาน (UPSERT_USER)
    if (eventType === 'UPSERT_USER') {
      var usr = payload.data;
      var userHeaders = [
        'User ID', 'ชื่อ-นามสกุล', 'ชื่อผู้ใช้ (Username)', 'เบอร์โทร', 'รหัส PIN',
        'ตำแหน่ง/บทบาท', 'บริษัทสังกัด', 'สถานะการใช้งาน', 'รถประจำ', 'Timestamp', 'Raw_JSON'
      ];
      var uSheet = getOrCreateSheet(ss, 'Users_Master', userHeaders, '#06b6d4', '#cffafe', '#155e75');

      var uRow = [
        usr.id || '-',
        usr.name || '-',
        usr.username || '-',
        usr.phone || '-',
        usr.pin || '1234',
        usr.role || '-',
        usr.companyId || 'LOG',
        usr.isActive ? 'ใช้งานปกติ' : 'ระงับการใช้งาน',
        usr.assignedVehicleId || '-',
        new Date().toLocaleString('th-TH'),
        JSON.stringify(usr)
      ];

      var uFoundRow = -1;
      var uLast = uSheet.getLastRow();
      if (uLast > 1) {
        var uIds = uSheet.getRange(2, 1, uLast - 1, 3).getValues();
        for (var ui = 0; ui < uIds.length; ui++) {
          if (String(uIds[ui][0]).trim() === String(usr.id).trim() ||
              (usr.username && String(uIds[ui][2]).trim() === String(usr.username).trim())) {
            uFoundRow = ui + 2;
            break;
          }
        }
      }

      if (uFoundRow > 0) {
        uSheet.getRange(uFoundRow, 1, 1, uRow.length).setValues([uRow]);
      } else {
        uSheet.appendRow(uRow);
      }

      return ContentService.createTextOutput(JSON.stringify({
        status: 'success',
        action: uFoundRow > 0 ? 'UPDATED' : 'INSERTED',
        userId: usr.id,
        username: usr.username
      })).setMimeType(ContentService.MimeType.JSON);
    }

    // 6. ซิงค์ประเภทงานและเช็คลิสต์มาตรฐาน (UPSERT_JOB_TYPES)
    if (eventType === 'UPSERT_JOB_TYPES') {
      var items = payload.data;
      if (!Array.isArray(items)) items = [items];
      var jtHeaders = [
        'Type ID', 'บริษัท', 'ชื่อประเภทงาน', 'จำนวนเช็คลิสต์', 'รายการเช็คลิสต์ (JSON)', 'Timestamp', 'Raw_JSON'
      ];
      var jtSheet = getOrCreateSheet(ss, 'Job_Types_Master', jtHeaders, '#ec4899', '#fce7f3', '#9d174d');

      for (var ji = 0; ji < items.length; ji++) {
        var jtItem = items[ji];
        var jtRow = [
          jtItem.id || '-',
          jtItem.companyId || 'LOG',
          jtItem.name || '-',
          Array.isArray(jtItem.defaultChecklist) ? jtItem.defaultChecklist.length : 0,
          JSON.stringify(jtItem.defaultChecklist || []),
          new Date().toLocaleString('th-TH'),
          JSON.stringify(jtItem)
        ];

        var jtFoundRow = -1;
        var jtLast = jtSheet.getLastRow();
        if (jtLast > 1) {
          var jtIds = jtSheet.getRange(2, 1, jtLast - 1, 3).getValues();
          for (var jx = 0; jx < jtIds.length; jx++) {
            if (String(jtIds[jx][0]).trim() === String(jtItem.id).trim() ||
                String(jtIds[jx][2]).trim() === String(jtItem.name).trim()) {
              jtFoundRow = jx + 2;
              break;
            }
          }
        }

        if (jtFoundRow > 0) {
          jtSheet.getRange(jtFoundRow, 1, 1, jtRow.length).setValues([jtRow]);
        } else {
          jtSheet.appendRow(jtRow);
        }
      }

      return ContentService.createTextOutput(JSON.stringify({
        status: 'success',
        action: 'UPSERTED_JOB_TYPES',
        count: items.length
      })).setMimeType(ContentService.MimeType.JSON);
    }

    // 7. ลบประเภทงานออกจาก Google Sheets (DELETE_JOB_TYPE)
    if (eventType === 'DELETE_JOB_TYPE') {
      var jtDel = payload.data;
      var jtSheet = ss.getSheetByName('Job_Types_Master') || ss.getSheetByName('ประเภทงานและเช็คลิสต์');
      var wasJtDel = false;
      if (jtSheet && jtDel) {
        var jtLast = jtSheet.getLastRow();
        if (jtLast > 1) {
          var jtIds = jtSheet.getRange(2, 1, jtLast - 1, 1).getValues();
          for (var jx = 0; jx < jtIds.length; jx++) {
            if (String(jtIds[jx][0]).trim() === String(jtDel.id).trim()) {
              jtSheet.deleteRow(jx + 2);
              wasJtDel = true;
              break;
            }
          }
        }
      }
      return ContentService.createTextOutput(JSON.stringify({
